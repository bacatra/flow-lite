<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Lite</title>
  <style>
    :root {
      --bg-island: rgba(8, 8, 10, 0.94);
      --border-glass: rgba(255, 255, 255, 0.14);
      --border-highlight: rgba(255, 255, 255, 0.28);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Outer Wrapper for positioning */
    .island-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    /* Flow Lite Pill (Strict Monochrome) */
    .island-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      height: 44px;
      padding: 0 16px;
      background: var(--bg-island);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-top: 1px solid var(--border-highlight);
      border-radius: 9999px;
      box-shadow: 0 18px 42px -6px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: grab;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }

    .island-pill:active {
      cursor: grabbing;
    }

    .island-pill:hover {
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 48px -4px rgba(0, 0, 0, 0.95), 0 0 1px rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    /* Idle State */
    .island-pill.idle {
      opacity: 0.98;
    }

    /* Hidden State (for dictation-only mode) */
    .island-pill.hidden-mode {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    /* Typing Detected State */
    .island-pill.typing-active {
      border-color: rgba(255, 255, 255, 0.65);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.9), 0 0 16px rgba(255, 255, 255, 0.25);
      background: rgba(16, 16, 18, 0.96);
      animation: subtle-pulse 1.6s infinite alternate ease-in-out;
    }

    @keyframes subtle-pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }

    /* Recording State (Pure Black & Bright White) */
    .island-pill.recording {
      height: 48px;
      padding: 0 20px;
      border-color: #ffffff;
      background: #000000;
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.95), 0 0 22px rgba(255, 255, 255, 0.35);
    }

    /* Processing State */
    .island-pill.processing {
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 14px rgba(255, 255, 255, 0.2);
      background: rgba(12, 12, 14, 0.96);
    }

    /* Success State */
    .island-pill.success {
      border-color: #ffffff;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 16px rgba(255, 255, 255, 0.3);
      background: #000000;
      animation: success-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes success-pop {
      0% { transform: scale(0.96); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* App Icon Badge */
    .icon-badge {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .icon-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      display: block;
    }

    .island-pill.recording .icon-badge {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      animation: beacon 1.1s infinite ease-in-out;
    }

    @keyframes beacon {
      0% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.92); opacity: 0.85; }
    }

    .island-pill.processing .icon-badge {
      border-color: #ffffff;
      animation: pulse-spin 1.2s infinite ease-in-out;
    }

    @keyframes pulse-spin {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* Main Content */
    .pill-content {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-tag {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .sep-dot {
      color: rgba(255, 255, 255, 0.25);
      font-size: 10px;
    }

    .status-text {
      font-size: 12.5px;
      color: var(--text-muted);
      letter-spacing: -0.15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kbd-chip {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    /* Monochrome Equalizer Waveform */
    .waveform-visualizer {
      display: none;
      align-items: center;
      gap: 3.5px;
      height: 20px;
      padding: 0 4px;
    }

    .wave-bar {
      width: 3px;
      height: 5px;
      border-radius: 9999px;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.4), #ffffff);
      transition: height 0.05s ease;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
    }

    /* Timer Display */
    .record-timer {
      display: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      letter-spacing: 0.5px;
    }

    /* Open Panel Indicator */
    .dock-menu-btn {
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      margin-left: 2px;
      transition: color 0.15s ease;
    }

    .dock-menu-btn:hover {
      color: #ffffff;
    }

    .dock-menu-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <div class="island-container">
    <div id="island" class="island-pill idle" title="Clique para abrir o Painel Flow Lite">
      <!-- App Icon Badge -->
      <div id="iconBadge" class="icon-badge">
        <img src="../../assets/icon.png" alt="Flow Lite">
      </div>

      <!-- Main Text / Content -->
      <div class="pill-content">
        <span class="brand-tag">Flow Lite</span>
        <span class="sep-dot">•</span>
        <span id="statusText" class="status-text">
          Segure <kbd class="kbd-chip">CAPS LOCK</kbd>
        </span>
      </div>

      <!-- Monochrome Live Waveform -->
      <div id="waveform" class="waveform-visualizer">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>

      <!-- Timer (visible only when recording) -->
      <span id="recordTimer" class="record-timer">00:00</span>

      <!-- Settings Menu Indicator -->
      <div class="dock-menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="19" cy="12" r="1"></circle>
          <circle cx="5" cy="12" r="1"></circle>
        </svg>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
